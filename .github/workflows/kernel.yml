name: Kernel fault qualification

on:
  pull_request:
    paths:
      - CMakeLists.txt
      - src/**
      - proto/**
      - progs/**
      - tests/kernel/**
      - .github/workflows/kernel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install system dependencies and matching headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake pkg-config python3 libbpfcc-dev llvm-dev \
            libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev \
            protobuf-compiler libabsl-dev libspdlog-dev libgflags-dev \
            "linux-headers-$(uname -r)"
      - name: Prepare original-runtime source control
        run: python3 tests/kernel/prepare-control.py
      - name: Build source control and candidate against the same dependencies
        run: |
          cmake -S "$RUNNER_TEMP/bpfki-source-control-src" -B "$RUNNER_TEMP/bpfki-source-control-build" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/bpfki-source-control-build" --parallel 2
          cmake --install "$RUNNER_TEMP/bpfki-source-control-build" --prefix "$RUNNER_TEMP/bpfki-source-control"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBPFKI_BUILD_KERNEL_TESTS=ON
          cmake --build build --parallel 2
          cmake --install build --prefix "$RUNNER_TEMP/bpfki-candidate"
      - name: Qualify kernel and verify fault, control, recovery, and repeat
        id: kernel
        run: |
          set +e
          bash tests/kernel/run.sh "$RUNNER_TEMP/bpfki-source-control" \
            "$RUNNER_TEMP/bpfki-candidate" "$GITHUB_WORKSPACE/build/kernel-tests"
          status=$?
          set -e
          echo "Host kernel test exit code: $status"
          if [[ $status == 2 ]]; then
            python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          outputs = Path(os.environ["GITHUB_OUTPUT"]).read_text().splitlines()
          path = next(line.removeprefix("evidence=") for line in outputs if line.startswith("evidence="))
          evidence = json.loads((Path(path) / "environment.json").read_text())
          assert evidence["outcome"] == "unsupported", "fallback requires explicit unsupported evidence"
          PYTHON
            echo 'fallback=true' >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
      - name: Install disposable guest build tools
        if: steps.kernel.outputs.fallback == 'true'
        run: |
          sudo apt-get install --no-install-recommends -y \
            qemu-system-x86 e2fsprogs bison flex libelf-dev libssl-dev bc curl xz-utils
      - name: Restore pinned kernel build cache
        id: kernel-cache
        if: steps.kernel.outputs.fallback == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bpfki/kernel
          key: bpfki-linux-6.8-amd64-ubuntu24-gcc13-${{ hashFiles('tests/kernel/vm/kernel.config', 'tests/kernel/vm/build-kernel.sh') }}
          restore-keys: bpfki-linux-6.8-amd64-ubuntu24-gcc13-
      - name: Build pinned guest kernel
        if: steps.kernel.outputs.fallback == 'true'
        run: |
          bash tests/kernel/vm/build-kernel.sh "$HOME/.cache/bpfki/kernel"
          for option in CONFIG_FUNCTION_TRACER=y CONFIG_DYNAMIC_FTRACE=y \
            CONFIG_DYNAMIC_FTRACE_WITH_REGS=y CONFIG_KPROBES_ON_FTRACE=y CONFIG_OPTPROBES=y; do
            grep -Fxq "$option" "$HOME/.cache/bpfki/kernel/linux-6.8/.config"
          done
      - name: Save pinned kernel build cache
        if: steps.kernel.outputs.fallback == 'true' && steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bpfki/kernel
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}
      - name: Build isolated guest root filesystem
        if: steps.kernel.outputs.fallback == 'true'
        run: |
          bash tests/kernel/vm/build-rootfs.sh "$HOME/.cache/bpfki/kernel/linux-6.8" \
            "$RUNNER_TEMP/bpfki-vm"
      - name: Record guest userland before fault execution
        if: steps.kernel.outputs.fallback == 'true'
        run: |
          identity_container="bpfki-userland-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'timeout --kill-after=2s 5s docker rm -f "$identity_container" >/dev/null 2>&1 || true' EXIT
          timeout --kill-after=2s 5s docker image inspect bpfki-kernel-rootfs:ci > "$RUNNER_TEMP/bpfki-vm/userland-image.json"
          timeout --kill-after=5s 30s docker run --rm -i --name "$identity_container" \
            --network none --cap-drop ALL --security-opt no-new-privileges --read-only \
            --user 1001:1001 --pids-limit 32 --memory 256m --cpus 1 --entrypoint python3 \
            bpfki-kernel-rootfs:ci - > "$RUNNER_TEMP/bpfki-vm/userland-identity.json" <<'PYTHON'
          import hashlib, json, re, subprocess
          from pathlib import Path
          def command(*args):
              return subprocess.check_output(args, text=True, timeout=10)
          targets = ["/opt/candidate/bin/bpfki", "/opt/control/bin/bpfki", "/opt/kernel-tests"]
          dependencies = command("ldd", *targets)
          assert "not found" not in dependencies, "guest runtime library is missing"
          libraries = sorted(set(re.findall(r"(?:=>[ \t]+|^[ \t]+)(/[^\s:]+)", dependencies, re.MULTILINE)))
          assert libraries, "no guest runtime dependency evidence"
          paths = targets + libraries + ["/opt/candidate/bin/clock_gettime", "/opt/candidate/bin/gettimeofday",
                                        "/opt/bpfki/tests/kernel/driver.cc", "/opt/bpfki/src/filter_layout.h"]
          hashes = {}
          for name in sorted(set(paths)):
              value = hashlib.sha256()
              with Path(name).open("rb") as source:
                  for block in iter(lambda: source.read(1024 * 1024), b""):
                      value.update(block)
              hashes[name] = value.hexdigest()
          print(json.dumps({"sha256": hashes, "ldd": dependencies,
                            "packages": command("dpkg-query", "-W"),
                            "compiler": command("gcc", "--version"),
                            "linker": command("ld", "--version")}, indent=2))
          PYTHON
      - name: Verify fault, control, recovery, and repeat in the guest
        if: steps.kernel.outputs.fallback == 'true'
        run: |
          bash tests/kernel/vm/run.sh "$HOME/.cache/bpfki/kernel/linux-6.8" \
            "$RUNNER_TEMP/bpfki-vm"
          python3 - "$RUNNER_TEMP/bpfki-vm" <<'PYTHON'
          import json, sys
          from pathlib import Path
          output = Path(sys.argv[1])
          paths = list((output / "guest").glob("bpfki-kernel-*/events.jsonl"))
          assert len(paths) == 1, "expected one guest comparison"
          events = [json.loads(line) for line in paths[0].read_text().splitlines()]
          probes = [event for event in events if event.get("installation") == "candidate" and
                    event.get("fault") == "BIO" and event.get("stage") == "owned_probe" and
                    event.get("operation") == "finite_fault"]
          assert len(probes) == 2 and [probe["phase"] for probe in probes] == ["before", "after"]
          identity = ["sequence", "pid", "starttime", "service_pid", "service_starttime", "map_id",
                      "key", "perf_fd", "program_id", "program_fd", "program_tag", "address_hex"]
          assert all(probes[0][key] == probes[1][key] for key in identity), "owned probe changed"
          assert probes[0]["sequence"] == 3 and probes[0]["key"] == probes[0]["pid"]
          for probe in probes:
              assert probe["identity_stable"] is True and probe["gaps"] == []
              assert probe["kprobes_read"] is True and probe["kprobe_matches"] == len(probe["kprobes"]) > 0
              assert probe["perf_matches"] == probe["program_matches"] == 1
              assert len(probe["queries"]) == 2 and {query["point"] for query in probe["queries"]} == {"enumeration", "recheck"}
              for query in probe["queries"]:
                  assert query["errno"] == 0 and query["fd_type"] == 2
                  assert query["symbol"] == "should_fail_bio" and query["offset"] == 0
                  assert query["perf_fd"] == probe["perf_fd"] and query["program_id"] == probe["program_id"]
                  assert query["address_hex"] == probe["address_hex"] and int(query["address_hex"], 16) != 0
              for status in probe["kprobes"]:
                  address, kind, symbol, *_ = status["raw"].split()
                  assert int(address, 16) == int(probe["address_hex"], 16) and kind == "k"
                  assert symbol == status["symbol"] and symbol in {"should_fail_bio+0x0", "should_fail_bio+0x4"}
                  assert status["FTRACE"] is True
                  assert all(status[flag] is False for flag in ["OPTIMIZED", "DISABLED", "GONE"])
          (output / "ftrace-mode.json").write_text(json.dumps({"passed": True, "probes": probes}, indent=2) + "\n")
          print("Owned BIO probe used FTRACE around the existing finite operation.")
          PYTHON
      - name: Remove disposable guest disk
        if: always()
        run: rm -f "$RUNNER_TEMP/bpfki-vm/rootfs.ext4"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kernel-amd64-evidence
          path: |
            ${{ runner.temp }}/bpfki-kernel-*/
            ${{ runner.temp }}/bpfki-source-control.json
            ${{ runner.temp }}/bpfki-source-control-build/CMakeCache.txt
            build/CMakeCache.txt
            ${{ runner.temp }}/bpfki-vm/
          if-no-files-found: error
